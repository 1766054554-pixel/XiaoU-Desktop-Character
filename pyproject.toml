[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaou-desktop-character"
version = "1.0.0"
description = "用一张角色图片制作可互动的 Windows 与 macOS 桌面角色。"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "PySide6>=6.8,<7",
    "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "PyInstaller>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]
